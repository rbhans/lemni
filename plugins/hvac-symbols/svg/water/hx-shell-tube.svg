<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 70" width="140" height="70" class="nx">
<title>Shell &amp; tube HX</title>
<style>
.nx{--ink3:#A9B0B9;--face:#FFFFFF;--side:#DCE0E5;--shadow:#D3D8DE}
