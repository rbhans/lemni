<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 120" width="80" height="120" class="nx">
<title>Tank</title>
<style>
.nx{--ink3:#A9B0B9;--face:#FFFFFF;--side:#DCE0E5;--shadow:#D3D8DE;--water:#3D8FE0}
.nx.dk{--ink3:#59616B;--face:#242930;--side:#1A1D22;--shadow:#0B0D10;--water:#4FA3F7}
.nx .sh{fill:var(--shadow)}
.nx .fc{fill:var(--face)}
.nx .so{fill:var(--side);stroke:var(--ink3);stroke-width:1.5;stroke-linejoin:round}
.nx .ol{fill:none;stroke:var(--ink3);stroke-width:1.5;stroke-linejoin:round}
.nx .hl{fill:none;stroke:var(--ink3);stroke-width:1}
.nx .liq{fill:var(--water);transform-box:fill-box;transform-origin:50% 100%;transition:transform .6s}
.nx .liq-b{transform:scaleY(min(1, var(--level,.6) * 8.611))}
.nx .liq-s{transform:scaleY(max(0, var(--level,.6) * 1.1314 - .1314))}
.nx .plate{transition:transform .2s}
.nx.st-alarm{--shadow:#CF1624}
.nx.st-fault{--shadow:#FC7734}
.nx.st-down{--shadow:#FAC600}
.nx.st-overridden{--shadow:#BFADDD}
.nx.st-stale{--shadow:#D9C09D}
.nx.st-disabled{--shadow:#D6D6D6}
.nx.st-alarm .plate,.nx.st-fault .plate,.nx.st-down .plate,.nx.st-overridden .plate,.nx.st-stale .plate,.nx.st-disabled .plate{transform:translate(6px,6px)}
.nx.st-disabled{--ink:#B9BFC7;--ink2:#BEC4CB;--ink3:#CDD2D8}
.nx.st-disabled.dk{--ink:#4B525B;--ink2:#454C55;--ink3:#3A4048}
.nx.st-disabled .body{--acc:var(--ink2);--acc-t:none}
</style>
<g class="body"><g class="plate" transform="translate(4 4)"><rect class="sh" x="20" y="98" width="6" height="12" rx="1" /><rect class="sh" x="54" y="98" width="6" height="12" rx="1" /><rect class="sh" x="10" y="10" width="60" height="94" rx="30" ry="12" /></g><rect class="so" x="20" y="98" width="6" height="12" rx="1" /><rect class="so" x="54" y="98" width="6" height="12" rx="1" /><rect class="fc" x="10" y="10" width="60" height="94" rx="30" ry="12" /><path class="liq liq-b" d="M14 92A26 9 0 0 0 66 92Z" /><rect class="liq liq-s" x="14" y="24" width="52" height="68.5" /><rect class="ol" x="10" y="10" width="60" height="94" rx="30" ry="12" /><line class="hl" x1="61" y1="40" x2="66" y2="40" /><line class="hl" x1="61" y1="58" x2="66" y2="58" /><line class="hl" x1="61" y1="76" x2="66" y2="76" /></g>
</svg>
