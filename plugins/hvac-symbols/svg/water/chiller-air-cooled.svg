<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 100" width="180" height="100" class="nx">
<title>Air-cooled chiller</title>
<style>
.nx{--ink2:#7B838E;--ink3:#A9B0B9;--face:#FFFFFF;--side:#DCE0E5;--shadow:#D3D8DE;--run:#15924E;--acc:var(--ink2)}
.nx.dk{--ink2:#8B949F;--ink3:#59616B;--face:#242930;--side:#1A1D22;--shadow:#0B0D10;--run:#3CD38A}
.m-run{--acc:var(--run);--acc-t:none}
.nx .sh{fill:var(--shadow)}
.nx .fo{fill:var(--face);stroke:var(--ink3);stroke-width:1.5;stroke-linejoin:round}
.nx .so{fill:var(--side);stroke:var(--ink3);stroke-width:1.5;stroke-linejoin:round}
.nx .d2{fill:none;stroke:var(--ink2);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.nx .twirl{transform-box:fill-box;transform-origin:center}
.nx.on .ac-s{stroke:var(--acc)}
.nx.on .ac-w{stroke-width:3}
.nx.on .twirl{animation:nx-twirl .45s linear infinite}
@keyframes nx-twirl{ 0%{transform:scaleX(1)} 50%{transform:scaleX(.12)} 100%{transform:scaleX(1)} }
@media (prefers-reduced-motion:reduce){ .nx *{animation:none !important} }
.nx .plate{transition:transform .2s}
.nx.st-alarm{--shadow:#CF1624}
.nx.st-fault{--shadow:#FC7734}
.nx.st-down{--shadow:#FAC600}
.nx.st-overridden{--shadow:#BFADDD}
.nx.st-stale{--shadow:#D9C09D}
.nx.st-disabled{--shadow:#D6D6D6}
.nx.st-alarm .plate,.nx.st-fault .plate,.nx.st-down .plate,.nx.st-overridden .plate,.nx.st-stale .plate,.nx.st-disabled .plate{transform:translate(6px,6px)}
.nx.st-disabled{--ink:#B9BFC7;--ink2:#BEC4CB;--ink3:#CDD2D8}
.nx.st-disabled.dk{--ink:#4B525B;--ink2:#454C55;--ink3:#3A4048}
.nx.st-disabled .body{--acc:var(--ink2);--acc-t:none}
</style>
<g class="body m-run"><g class="plate" transform="translate(4 4)"><rect class="sh" x="24" y="10" width="36" height="12" rx="2" /><rect class="sh" x="72" y="10" width="36" height="12" rx="2" /><rect class="sh" x="120" y="10" width="36" height="12" rx="2" /><rect class="sh" x="10" y="22" width="160" height="58" rx="3" /><rect class="sh" x="14" y="80" width="152" height="10" rx="2" /></g><rect class="fo" x="24" y="10" width="36" height="12" rx="2" /><g class="twirl"><line class="d2 ac-s ac-w" x1="29" y1="16" x2="55" y2="16" /></g><rect class="fo" x="72" y="10" width="36" height="12" rx="2" /><g class="twirl"><line class="d2 ac-s ac-w" x1="77" y1="16" x2="103" y2="16" /></g><rect class="fo" x="120" y="10" width="36" height="12" rx="2" /><g class="twirl"><line class="d2 ac-s ac-w" x1="125" y1="16" x2="151" y2="16" /></g><rect class="fo" x="10" y="22" width="160" height="58" rx="3" /><path class="d2" d="M18 30L36 72L54 30L72 72L90 30L108 72L126 30L144 72L162 30" /><rect class="so" x="14" y="80" width="152" height="10" rx="2" /></g>
</svg>
