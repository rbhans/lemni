<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 100" width="140" height="100" class="nx">
<title>End-suction pump</title>
<style>
.nx{--ink2:#7B838E;--ink3:#A9B0B9;--face:#FFFFFF;--side:#DCE0E5;--shadow:#D3D8DE;--glass:#E4EBF2;--run:#15924E;--acc:var(--ink2)}
.nx.dk{--ink2:#8B949F;--ink3:#59616B;--face:#242930;--side:#1A1D22;--shadow:#0B0D10;--glass:#2B3540;--run:#3CD38A}
.m-run{--acc:var(--run);--acc-t:none}
.nx .sh{fill:var(--shadow)}
.nx .fo{fill:var(--face);stroke:var(--ink3);stroke-width:1.5;stroke-linejoin:round}
.nx .so{fill:var(--side);stroke:var(--ink3);stroke-width:1.5;stroke-linejoin:round}
.nx .f2{fill:var(--ink2)}
.nx .f3{fill:var(--ink3)}
.nx .hl{fill:none;stroke:var(--ink3);stroke-width:1}
.nx .gh{fill:none;stroke:none}
.nx .win{fill:var(--glass);stroke:var(--ink3);stroke-width:1.5}
.nx .rotor,.nx .hand{transform-box:fill-box;transform-origin:center}
.nx.ccw .hand{transform:scaleX(-1)}
.nx.on .ac-f{fill:var(--acc)}
.nx.on .rotor{animation:nx-spin 1.5s linear infinite}
.nx.on .rotor.fast{animation-duration:.9s}
.nx.on.ccw .rotor{animation-direction:reverse}
@keyframes nx-spin{ to{transform:rotate(360deg)} }
@media (prefers-reduced-motion:reduce){ .nx *{animation:none !important} }
.nx .plate{transition:transform .2s}
.nx.st-alarm{--shadow:#CF1624}
.nx.st-fault{--shadow:#FC7734}
.nx.st-down{--shadow:#FAC600}
.nx.st-overridden{--shadow:#BFADDD}
.nx.st-stale{--shadow:#D9C09D}
.nx.st-disabled{--shadow:#D6D6D6}
.nx.st-alarm .plate,.nx.st-fault .plate,.nx.st-down .plate,.nx.st-overridden .plate,.nx.st-stale .plate,.nx.st-disabled .plate{transform:translate(6px,6px)}
.nx.st-disabled{--ink:#B9BFC7;--ink2:#BEC4CB;--ink3:#CDD2D8}
.nx.st-disabled.dk{--ink:#4B525B;--ink2:#454C55;--ink3:#3A4048}
.nx.st-disabled .body{--acc:var(--ink2);--acc-t:none}
</style>
<g class="body m-run"><g class="plate" transform="translate(4 4)"><rect class="sh" x="14" y="74" width="116" height="6" rx="1.5" /><rect class="sh" x="92" y="68" width="28" height="6" rx="1" /><rect class="sh" x="32" y="70" width="16" height="4" rx="1" /><rect class="sh" x="10" y="38" width="6" height="24" rx="1.5" /><rect class="sh" x="16" y="42" width="10" height="16" rx="1" /><rect class="sh" x="42" y="16" width="14" height="14" rx="1" /><rect class="sh" x="38" y="12" width="22" height="4" rx="1" /><circle class="sh" cx="40" cy="50" r="22" /><circle class="sh" cx="40" cy="50" r="3" /><rect class="sh" x="62" y="42" width="18" height="16" rx="2" /><rect class="sh" x="86" y="32" width="40" height="36" rx="4" /></g><rect class="so" x="14" y="74" width="116" height="6" rx="1.5" /><rect class="so" x="92" y="68" width="28" height="6" rx="1" /><rect class="so" x="32" y="70" width="16" height="4" rx="1" /><rect class="so" x="10" y="38" width="6" height="24" rx="1.5" /><rect class="so" x="16" y="42" width="10" height="16" rx="1" /><rect class="so" x="42" y="16" width="14" height="14" rx="1" /><rect class="so" x="38" y="12" width="22" height="4" rx="1" /><circle class="fo" cx="40" cy="50" r="22" /><circle class="win" cx="40" cy="50" r="15" /><g class="rotor fast"><g class="hand"><circle class="gh" cx="40" cy="50" r="13.64" /><path class="f2 ac-f" d="M39.12 45.6Q42.75 38.45 50.23 41.2Q44.95 42.3 41.98 46.92Z" transform="rotate(0 40 50)" /><path class="f2 ac-f" d="M39.12 45.6Q42.75 38.45 50.23 41.2Q44.95 42.3 41.98 46.92Z" transform="rotate(120 40 50)" /><path class="f2 ac-f" d="M39.12 45.6Q42.75 38.45 50.23 41.2Q44.95 42.3 41.98 46.92Z" transform="rotate(240 40 50)" /></g></g><circle class="fo" cx="40" cy="50" r="3" /><rect class="so" x="62" y="42" width="18" height="16" rx="2" /><rect class="f3" x="80" y="46" width="6" height="8" rx="1" /><rect class="fo" x="86" y="32" width="40" height="36" rx="4" /><line class="hl" x1="92" y1="36" x2="92" y2="64" /><line class="hl" x1="97" y1="36" x2="97" y2="64" /><line class="hl" x1="102" y1="36" x2="102" y2="64" /><line class="hl" x1="107" y1="36" x2="107" y2="64" /><line class="hl" x1="112" y1="36" x2="112" y2="64" /><line class="hl" x1="117" y1="36" x2="117" y2="64" /><line class="hl" x1="122" y1="36" x2="122" y2="64" /></g>
</svg>
