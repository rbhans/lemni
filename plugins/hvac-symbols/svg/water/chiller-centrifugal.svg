class="rotor fast"><g class="hand"><circle class="gh" cx="64" cy="28" r="13.02"/><path class="f2 ac-f" d="M63.16 23.8Q66.62 16.98 73.77 19.6Q68.72 20.65 65.89 25.06Z" transform="rotate(0 64 28)"/><path class="f2 ac-f" d="M63.16 23.8Q66.62 16.98 73.77 19.6Q68.72 20.65 65.89 25.06Z" transform="rotate(120 64 28)"/><path class="f2 ac-f" d="M63.16 23.8Q66.62 16.98 73.77 19.6Q68.72 20.65 65.89 25.06Z" transform="rotate(240 64 28)"/></g></g><circle class="fo" cx="64" cy="28" r="4"/></g>
</svg>
