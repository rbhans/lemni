<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 120" width="180" height="120" class="nx">
<title>Centrifugal chiller</title>
<style>
.nx{--ink2:#7B838E;--ink3:#A9B0B9;--face:#FFFFFF;--side:#DCE0E5;--shadow:#D3D8DE;--cool:#1F78DC;--cool-t:rgba(31,120,220,.12);--run:#15924E;--cw:#1F9E66;--cw-t:rgba(31,158,102,.13);--acc:var(--ink2);--acc-t:none}
.nx.dk{--ink2:#8B949F;--ink3:#59616B;--face:#242930;--side:#1A1D22;--shadow:#0B0D10;--cool:#4CA4FF;--cool-t:rgba(76,164,255,.17);--run:#3CD38A;--cw:#4FD39A;--cw-t:rgba(79,211,154,.16)}
.m-cool{--acc:var(--cool);--acc-t:var(--cool-t)}
.m-cw{--acc:var(--cw);--acc-t:var(--cw-t)}
.m-run{--acc:var(--run);--acc-t:none}
.nx .sh{fill:var(--shadow)}
.nx .fo{fill:var(--face);stroke:var(--ink3);stroke-width:1.5;stroke-linejoin:round}
.nx .so{fill:var(--side);stroke:var(--ink3);stroke-width:1.5;stroke-linejoin:round}
.nx .f2{fill:var(--ink2)}
.nx .hl{fill:none;stroke:var(--ink3);stroke-width:1}
.nx .gh{fill:none;stroke:none}
.nx .tint{fill:none}
.nx .tube{fill:none;stroke:var(--ink3);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.nx .rotor,.nx .hand{transform-box:fill-box;transform-origin:center}
.nx.ccw .hand{transform:scaleX(-1)}
.nx .shim{display:none}
.nx.on .tint{fill:var(--acc-t)}
.nx.on .ac-s{stroke:var(--acc)}
.nx.on .ac-f{fill:var(--acc)}
.nx.on .rotor{animation:nx-spin 1.5s linear infinite}
.nx.on .rotor.fast{animation-duration:.9s}
.nx.on.ccw .rotor{animation-direction:reverse}
.nx.on .shim{display:inline;fill:none;stroke:#FFFFFF;stroke-width:1.2;stroke-dasharray:2 10;stroke-linecap:round;opacity:0;animation:nx-shim 1.8s ease-in-out infinite}
.nx.on .shim2{stroke-dashoffset:-6;animation-delay:-.9s}
.nx.on .tube{stroke-width:2.5}
@keyframes nx-spin{ to{transform:rotate(360deg)} }
@keyframes nx-shim{ 0%,100%{opacity:0} 50%{opacity:.85} }
@media (prefers-reduced-motion:reduce){ .nx *{animation:none !important} }
</style>
