<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 110" width="160" height="110" class="nx">
<title>Drum boiler</title>
<style>
.nx{--ink3:#A9B0B9;--face:#FFFFFF;--side:#DCE0E5;--shadow:#D3D8DE;--glass:#E4EBF2;--heat:#DA4136;--heat-t:rgba(218,65,54,.11);--acc-t:none}
.nx.dk{--ink3:#59616B;--face:#242930;--side:#1A1D22;--shadow:#0B0D10;--glass:#2B3540;--heat:#FF6A5C;--heat-t:rgba(255,106,92,.16)}
.m-heat{--acc:var(--heat);--acc-t:var(--heat-t)}
.nx .sh{fill:var(--shadow)}
.nx .fo{fill:var(--face);stroke:var(--ink3);stroke-width:1.5;stroke-linejoin:round}
.nx .so{fill:var(--side);stroke:var(--ink3);stroke-width:1.5;stroke-linejoin:round}
.nx .hl{fill:none;stroke:var(--ink3);stroke-width:1}
.nx .win{fill:var(--glass);stroke:var(--ink3);stroke-width:1.5}
.nx .tint,.nx .flame{fill:none}
.nx.on .tint{fill:var(--acc-t)}
.nx.on .flame{fill:var(--heat);animation:nx-flick 1.3s ease-in-out infinite}
@keyframes nx-flick{ 0%,100%{opacity:1} 45%{opacity:.55} 70%{opacity:.85} }
@media (prefers-reduced-motion:reduce){ .nx *{animation:none !important} }
.nx .plate{transition:transform .2s}
.nx.st-alarm{--shadow:#CF1624}
.nx.st-fault{--shadow:#FC7734}
.nx.st-down{--shadow:#FAC600}
.nx.st-overridden{--shadow:#BFADDD}
.nx.st-stale{--shadow:#D9C09D}
.nx.st-disabled{--shadow:#D6D6D6}
.nx.st-alarm .plate,.nx.st-fault .plate,.nx.st-down .plate,.nx.st-overridden .plate,.nx.st-stale .plate,.nx.st-disabled .plate{transform:translate(6px,6px)}
.nx.st-disabled{--ink:#B9BFC7;--ink2:#BEC4CB;--ink3:#CDD2D8}
.nx.st-disabled.dk{--ink:#4B525B;--ink2:#454C55;--ink3:#3A4048}
.nx.st-disabled .body{--acc:var(--ink2);--acc-t:none}
</style>
<g class="body m-heat"><g class="plate" transform="translate(4 4)"><rect class="sh" x="118" y="10" width="14" height="20" rx="1.5" /><path class="sh" d="M56 80H74L78 100H52Z" /><path class="sh" d="M110 80H128L132 100H106Z" /><rect class="sh" x="34" y="26" width="116" height="60" rx="14" ry="30" /><rect class="sh" x="10" y="38" width="28" height="36" rx="3" /></g><rect class="so" x="118" y="10" width="14" height="20" rx="1.5" /><path class="so" d="M56 80H74L78 100H52Z" /><path class="so" d="M110 80H128L132 100H106Z" /><rect class="fo" x="34" y="26" width="116" height="60" rx="14" ry="30" /><rect class="tint" x="34" y="26" width="116" height="60" rx="14" ry="30" /><line class="hl" x1="72" y1="27" x2="72" y2="85" /><line class="hl" x1="118" y1="27" x2="118" y2="85" /><rect class="fo" x="10" y="38" width="28" height="36" rx="3" /><circle class="win" cx="24" cy="52" r="7" /><circle class="flame" cx="24" cy="52" r="5" /><line class="hl" x1="16" y1="63" x2="32" y2="63" /><line class="hl" x1="16" y1="67" x2="32" y2="67" /><line class="hl" x1="16" y1="71" x2="32" y2="71" /></g>
</svg>
