<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 20" width="100" height="20" class="nx">
<title>Duct</title>
<style>
.nx{--duct:#C3C9D0;--duct-lo:#A9B0B9;--air:#FFFFFF}
.nx.dk{--duct:#363D46;--duct-lo:#2A3038;--air:#7D8794}
.nx .du-lo{fill:var(--duct-lo)}
.nx .du{fill:var(--duct)}
.nx .air{display:none}
.nx.flow .air{display:inline;fill:none;stroke:var(--air);stroke-width:3.5;stroke-dasharray:5 25;stroke-linecap:round;animation:nx-d30 1.2s linear infinite}
@keyframes nx-d30{ to{stroke-dashoffset:-30} }
@media (prefers-reduced-motion:reduce){ .nx *{animation:none !important} }
</style>
<g class="body"><rect class="du-lo" x="0" y="0" width="100" height="20"/><rect class="du" x="0" y="2" width="100" height="16"/><path class="air" d="M0 10H100"/></g>
</svg>
