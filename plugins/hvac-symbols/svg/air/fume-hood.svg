<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="100" height="120" class="nx">
<title>Fume hood</title>
<style>
.nx{--ink2:#7B838E;--ink3:#A9B0B9;--face:#FFFFFF;--side:#DCE0E5;--shadow:#D3D8DE;--glass:#E4EBF2}
.nx.dk{--ink2:#8B949F;--ink3:#59616B;--face:#242930;--side:#1A1D22;--shadow:#0B0D10;--glass:#2B3540}
.nx .sh{fill:var(--shadow)}
.nx .fo{fill:var(--face);stroke:var(--ink3);stroke-width:1.5;stroke-linejoin:round}
.nx .so{fill:var(--side);stroke:var(--ink3);stroke-width:1.5;stroke-linejoin:round}
.nx .ol{fill:none;stroke:var(--ink3);stroke-width:1.5;stroke-linejoin:round}
.nx .f2{fill:var(--ink2)}
.nx .f3{fill:var(--ink3)}
.nx .d3{fill:none;stroke:var(--ink3);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.nx .cav{fill:var(--ink3);fill-opacity:.35}
.nx .glass{fill:var(--glass);fill-opacity:.85;stroke:var(--ink3);stroke-width:1.5}
.nx .sash-g{transform-box:fill-box;transform-origin:50% 0;transform:scaleY(calc(1 - var(--sash,.5)));transition:transform .6s;vector-effect:non-scaling-stroke}
.nx .sash-r{transform:translateY(calc(var(--sash,.5) * -34px));transition:transform .6s}
</style>
<g class="body"><rect class="so" x="40" y="10" width="20" height="12" rx="1"/><rect class="sh" x="14" y="24" width="80" height="90" rx="4"/><rect class="fo" x="10" y="20" width="80" height="90" rx="4"/><line class="d3" x1="10" y1="32" x2="90" y2="32"/><rect class="cav" x="18" y="38" width="64" height="38" rx="2"/><rect class="glass sash-g" x="18" y="38" width="64" height="34"/><rect class="f2 sash-r" x="18" y="72" width="64" height="4" rx="1"/><rect class="f3" x="14" y="76" width="72" height="4" rx="1"/><rect class="ol" x="18" y="84" width="30" height="22" rx="2"/><rect class="ol" x="52" y="84" width="30" height="22" rx="2"/><line class="d3" x1="42" y1="90" x2="42" y2="98"/><line class="d3" x1="58" y1="90" x2="58" y2="98"/></g>
</svg>
