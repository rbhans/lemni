<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" class="nx">
<title>Air-to-air HX</title>
<style>
.nx{--ink2:#7B838E;--ink3:#A9B0B9;--face:#FFFFFF;--shadow:#D3D8DE}
.nx.dk{--ink2:#8B949F;--ink3:#59616B;--face:#242930;--shadow:#0B0D10}
.nx .sh{fill:var(--shadow)}
.nx .fo{fill:var(--face);stroke:var(--ink3);stroke-width:1.5;stroke-linejoin:round}
.nx .d2{fill:none;stroke:var(--ink2);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.nx .hl{fill:none;stroke:var(--ink3);stroke-width:1}
.nx .plate{transition:transform .2s}
.nx.st-alarm{--shadow:#CF1624}
.nx.st-fault{--shadow:#FC7734}
.nx.st-down{--shadow:#FAC600}
.nx.st-overridden{--shadow:#BFADDD}
.nx.st-stale{--shadow:#D9C09D}
.nx.st-disabled{--shadow:#D6D6D6}
.nx.st-alarm .plate,.nx.st-fault .plate,.nx.st-down .plate,.nx.st-overridden .plate,.nx.st-stale .plate,.nx.st-disabled .plate{transform:translate(6px,6px)}
.nx.st-disabled{--ink:#B9BFC7;--ink2:#BEC4CB;--ink3:#CDD2D8}
.nx.st-disabled.dk{--ink:#4B525B;--ink2:#454C55;--ink3:#3A4048}
.nx.st-disabled .body{--acc:var(--ink2);--acc-t:none}
</style>
<g class="body"><g class="plate" transform="translate(4 4)"><polygon class="sh" points="60,10 110,60 60,110 10,60" /></g><polygon class="fo" points="60,10 110,60 60,110 10,60" /><line class="hl" x1="22.5" y1="60" x2="60" y2="22.5" /><line class="hl" x1="97.5" y1="60" x2="60" y2="97.5" /><line class="hl" x1="35" y1="60" x2="60" y2="35" /><line class="hl" x1="85" y1="60" x2="60" y2="85" /><line class="hl" x1="47.5" y1="60" x2="60" y2="47.5" /><line class="hl" x1="72.5" y1="60" x2="60" y2="72.5" /><line class="d2" x1="10" y1="60" x2="110" y2="60" /><line class="d2" x1="60" y1="10" x2="60" y2="110" /></g>
</svg>
