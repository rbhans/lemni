<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 70 90" width="70" height="90" class="nx">
<title>Round damper</title>
<style>
.nx{--ink:#2A2F36;--ink2:#7B838E;--ink3:#A9B0B9;--face:#FFFFFF;--shadow:#D3D8DE;--run:#15924E;--acc:var(--ink2)}
.nx.dk{--ink:#D3D8DE;--ink2:#8B949F;--ink3:#59616B;--face:#242930;--shadow:#0B0D10;--run:#3CD38A}
.m-run{--acc:var(--run);--acc-t:none}
.nx .sh{fill:var(--shadow)}
.nx .fo{fill:var(--face);stroke:var(--ink3);stroke-width:1.5;stroke-linejoin:round}
.nx .fi{fill:var(--ink)}
.nx .f2{fill:var(--ink2)}
.nx .hl{fill:none;stroke:var(--ink3);stroke-width:1}
.nx .blade{transform-box:fill-box;transform-origin:center}
.nx .blade{transform:rotate(var(--blade,45deg));transition:transform .6s}
.nx.on .ac-f{fill:var(--acc)}
</style>
<g class="body m-run"><rect class="sh" x="29" y="14" width="20" height="10" rx="2"/><rect class="fo" x="25" y="10" width="20" height="10" rx="2"/><circle class="sh" cx="39" cy="49" r="25"/><circle class="fo" cx="35" cy="45" r="25"/><circle class="hl" cx="35" cy="45" r="21"/><g class="blade"><rect class="f2 ac-f" x="13" y="42.5" width="44" height="5" rx="2.5"/></g><circle class="fi" cx="35" cy="45" r="2.5"/></g>
</svg>
